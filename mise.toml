min_version = "2026.11.12"

[settings]
# Install only through ./dev setup; never implicit.
locked = true
auto_install = false
exec_auto_install = false
not_found_auto_install = false
lockfile = true

[tools]
# Every tool that ./dev ci calls is pinned here, so the Mac, CI and cloud sessions run the same versions.
python = "3.13.18"
shellcheck = "0.11.0"
actionlint = "1.7.12"
# Core checks use jq for guard bindings and Ruby's Psych for workflow YAML (harness/check-bindings, check-pins).
jq = "1.8.2"
ruby = "4.0.10"
