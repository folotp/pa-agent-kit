# Read by harness/conf.awk. Restricted TOML subset: `key = "string"`, `key = ["a", "b"]` on one
# line, and the tables [checks], [verbs] and [gate]. Anything else is refused, so a typo cannot silently drop
# a check. This repository releases nothing to a live system, so it has no [gate] table.
profile = "plugin"

# Offline check run by `./dev check` and at the start of `./dev ci`: specs.lock against its watch list.
check = "python3 -B tools/specs/specs.py check"

# Commands that must resolve under mise (names as found on PATH, not mise tool names).
tools = ["python3", "shellcheck", "actionlint", "jq", "ruby"]

# Run in order by `./dev ci`, from the repository root, each through `bash -c`.
[checks]
command-index = "harness/commands list --check"
operator-docs = "python3 -B tools/workshop/check_docs.py check-docs docs AGENTS.md CLAUDE.md harness/gh-token.md"
cited-paths = "python3 -B tools/workshop/check_docs.py check-paths"
unit-tests = "python3 -B -m unittest discover -s tests -v"
new-repo-tests = "python3 -B -m unittest discover -s tools/new-repo -v"
marketplace = "python3 -B scripts/validate-marketplace.py"
shellcheck = "shellcheck dev harness/dev harness/templates/dev harness/gate harness/guard harness/check-dependabot harness/check-bindings harness/gh-token.sh harness/git-prune-merged.sh harness/commands harness/harness-sync harness/skill-links harness/githooks/* tools/probes/*.sh scripts/cloud-env-setup.sh"
# The workflows, and the consumers' CI skeleton (never under .github/workflows/ here).
actionlint = "actionlint && actionlint harness/templates/ci.yml"

# Workshop verbs, `./dev <name> [args]`.
[verbs]
specs = "python3 -B tools/specs/specs.py"
# Workshop only (not in core.files): `./dev sync <rev> <consumer-checkout> [--pr]` copies the core into a
# consumer's .harness/ as one commit; see tools/sync/sync.py and docs/harness-core.md, 'Sync'.
sync = "python3 -B tools/sync/sync.py"

# For a read-only dry run without starting mise, call tools/new-repo/init.py with python3 -B.
init = "python3 -B tools/new-repo/init.py"
