name: Release
# Merging a plugin version bump is the release: tag <plugin>/v<version> and
# open a DRAFT release. Publishing stays manual, after assets are attached
# (release immutability makes a published release permanent).
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/marketplace.json'
  workflow_dispatch:
    inputs:
      base:
        description: Commit before the change (releases the plugins whose version differs from it)
        required: true
      dry_run:
        description: Print the plan; create no tag and no release
        type: boolean
        default: true

permissions:
  contents: write

# One release run at a time: two runs must not tag the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag changed plugin versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event_name == 'push' && github.event.before || inputs.base }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        # Refusals before anything is tagged (session 24, K8). A base that is not a commit would
        # make every plugin look changed, so it is refused in both modes (all zeros is a push
        # with no previous commit, which the script reads as "release nothing"). Write mode, a
        # push or a dispatch with dry_run off, runs only from main and only for a commit on main:
        # a dispatch from another branch would tag that branch's unmerged versions.
        run: |
          set -euo pipefail
          if [ "$BASE" != 0000000000000000000000000000000000000000 ] && ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base '$BASE' does not resolve to a commit"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            if ! [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::error::write mode runs from main only (ref: $GITHUB_REF); dispatch from main, or keep dry_run on"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_SHA is not on origin/main: nothing is tagged"
              exit 1
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          args=(--base "$BASE" --head "$GITHUB_SHA")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/release-plugins.py "${args[@]}"
