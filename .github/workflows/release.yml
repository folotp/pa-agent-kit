name: Release
# A release is two steps (session 25). PA tags the merge commit of a version bump,
# `<plugin>/v<version>`, with PA's own token: the tag ruleset lets only PA create `*/v*` tags,
# and the GitHub Actions App cannot be a bypass actor on a personal repository. Pushing that
# tag runs the `release` job, which opens a DRAFT release on it and attaches the zips.
# Publishing stays manual, after the assets are checked (release immutability makes a
# published release and its tag permanent). docs/releases.md has the routine.
on:
  push:
    tags: ['*/v*']
  workflow_dispatch:
    inputs:
      base:
        description: Commit before the change; lists the tags PA would push for the plugins whose version differs from it
        required: true

permissions:
  contents: read

# One run per tag: with a shared group GitHub cancels a pending run when a newer one queues
# (cancel-in-progress does not change that), so a third tag pushed during a run would cost
# the second tag its draft. A rerun of the same tag still queues behind its first run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Preview only: no token with write access, nothing created.
  preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: List the tags a change calls for
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [ "$BASE" != 0000000000000000000000000000000000000000 ] && ! git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            echo "::error::base '$BASE' does not resolve to a commit"
            exit 1
          fi
          python3 scripts/release-plugins.py --base "$BASE" --head "$GITHUB_SHA"

  # The write token exists only here, and only for a pushed tag. The tag's commit must be on
  # main: the job runs the checked-out scripts/release-plugins.py with that token, so a tag on
  # an unmerged commit would run unreviewed code with it (Codex C1 of session 24b).
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Draft the release of the pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on origin/main: nothing runs"
            exit 1
          fi
          python3 scripts/release-plugins.py --tag "$TAG" --head "$GITHUB_SHA"
