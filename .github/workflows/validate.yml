name: Marketplace validation
on:
  # workflow_dispatch: manual runs, which check every plugin. A PR opened by the weekly specs bump
  # gets its pull_request run only after a maintainer approves it (see protected-main.md).
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Not the required context itself: `gate` below is, and it needs this job to succeed.
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_VERSION: v2026.11.12
      # sha256 of the linux-x64 binary, from SHASUMS256.txt of the mise release
      MISE_SHA256: 9c12c24f5eac6b6357e5265e2629166cc3005459037f5d747680a99e375ff2ab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned mise
        run: |
          set -euo pipefail
          curl -fsSL -o mise "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64"
          echo "${MISE_SHA256}  mise" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 mise "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned tools
        env:
          # Read-only job token, only to avoid GitHub API rate limits while mise downloads tools.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./dev setup

      # Runs the unit tests, the marketplace validator, shellcheck and actionlint (harness.toml).
      - name: ./dev ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./dev ci

  # A PR that changes files under plugins/<name>/ must bump that plugin's version: merging a
  # bump is the release, and PA's installs follow main (session 24, K5). PRs only: a push to main
  # has no base to compare with. Stdlib Python, the runner's own.
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Changed plugins carry a version bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/check-version-bump.py --base "$BASE_SHA" --head HEAD

  # Path filters: a plugin's own checks run only when files under plugins/<name>/ change.
  # To add a plugin's checks, add an output here, a job gated on it, and the job to `gate`'s
  # needs. projectionlab and session-telemetry hold skills and a manifest only, no code or
  # tests: `./dev ci` validates their manifests, so they have no job (docs/protected-main.md).
  # Plain `git diff` instead of a third-party filter action: no dependency to pin.
  changes:
    name: Changed plugins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pa_toolkit: ${{ steps.filter.outputs.pa_toolkit }}
      organon: ${{ steps.filter.outputs.organon }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          # Empty outside pull requests: pushes to main and manual runs check every plugin.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed() {
            [ -z "$BASE_SHA" ] || ! git diff --quiet "$BASE_SHA"...HEAD -- "plugins/$1/"
          }
          if changed pa-toolkit; then echo "pa_toolkit=true" >> "$GITHUB_OUTPUT"; else echo "pa_toolkit=false" >> "$GITHUB_OUTPUT"; fi
          if changed organon; then echo "organon=true" >> "$GITHUB_OUTPUT"; else echo "organon=false" >> "$GITHUB_OUTPUT"; fi

  # Organon's unit suite only. Its own `scripts/dev check` assumes the plugin is the repository
  # root and fails inside this monorepo, so it is not run here (docs/protected-main.md).
  # uv is a dependency of the plugin (locked by plugins/organon/uv.lock); the version is the
  # one in the plugin's own toolchain.json, the action is pinned by SHA.
  plugin-organon:
    name: Plugin checks (organon)
    needs: changes
    if: needs.changes.outputs.organon == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12'
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt jq zip unzip
      - name: Unit tests
        working-directory: plugins/organon
        run: uv run --locked python -B -m unittest discover -s tests

  plugin-pa-toolkit:
    name: Plugin checks (pa-toolkit)
    needs: changes
    if: needs.changes.outputs.pa_toolkit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        working-directory: plugins/pa-toolkit
        run: python3 -B -m unittest discover -s tests -v

  # The one required main-protection context (session 24, K4): branch protection names this
  # display name, so keep the two aligned. It runs after every other job, also when one failed,
  # and fails unless the core checks and the change filter succeeded and every other job
  # succeeded or was skipped (a plugin job is skipped when its plugin did not change, the version
  # check outside pull requests). Add each new job to `needs`.
  gate:
    name: Marketplace validation
    if: always()
    needs: [validate, changes, version-bump, plugin-organon, plugin-pa-toolkit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s' "$NEEDS" | jq -e '
            (.validate.result == "success") and (.changes.result == "success")
            and ([.[] | .result] | all(. == "success" or . == "skipped"))' >/dev/null
