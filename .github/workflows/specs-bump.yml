name: Specs bump
# Weekly: re-resolve the watched specifications (tools/specs/watch.json) and open a PR when
# specs.lock changed. Runs `./dev specs update`, the only online step; every other check reads the
# lock. See docs/harness-core.md, 'Spec tracking'.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
permissions: {}
concurrency:
  group: specs-bump
  cancel-in-progress: false
jobs:
  bump:
    name: Bump specs.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the PR
    env:
      MISE_VERSION: v2026.11.12
      # sha256 of the linux-x64 binary, from SHASUMS256.txt of the mise release
      MISE_SHA256: 9c12c24f5eac6b6357e5265e2629166cc3005459037f5d747680a99e375ff2ab
    steps:
      # The job token can write contents, so it stays out of .git/config and out of the steps
      # that download tools or fetch upstream pages; only the last step holds it (session 24, K11).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned mise
        run: |
          set -euo pipefail
          curl -fsSL -o mise "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64"
          echo "${MISE_SHA256}  mise" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 mise "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # No token: mise.lock pins direct release URLs, so the downloads need no API rate limit.
      - name: Install pinned tools
        run: ./dev setup

      - name: Resolve sources
        run: ./dev specs update --summary "$RUNNER_TEMP/summary.md"

      - name: Open the bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- specs.lock; then
            echo "Nothing moved: no PR."
            exit 0
          fi
          open="$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("specs-bump/"))] | length')"
          if [ "$open" -gt 0 ]; then
            echo "A bump PR is already open: merge or close it first. Upstream moves are picked up on the next run."
            exit 0
          fi
          branch="specs-bump/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add specs.lock
          git commit -m "chore: bump specs.lock"
          # The branch carries the lock and nothing else: a step that changed another file (a
          # tool, an upstream page) cannot get it pushed with the write token.
          changed="$(git diff --name-only origin/main...HEAD)"
          if ! [ "$changed" = "specs.lock" ]; then
            echo "::error::the bump branch would change more than specs.lock:"
            printf '%s\n' "$changed"
            exit 1
          fi
          # The token goes in as a header for this one command, as actions/checkout would set it.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          {
            echo "Weekly re-resolution of the watched specifications moved:"
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Read the named pages, then merge if the plugins still pass. The required check comes from this PR's own run; if it shows as waiting for approval, a maintainer approves it (see docs/protected-main.md)."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "chore: bump specs.lock ($(date -u +%Y-%m-%d))" --body-file "$RUNNER_TEMP/body.md"
